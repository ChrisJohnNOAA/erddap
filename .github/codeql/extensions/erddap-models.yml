extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: barrierModel
    data:
      # ========================================================================
      # 1. LEGACY INITIALIZATION PATHWAY
      # ========================================================================
      - ["gov.noaa.pfel.erddap.dataset", "EDD", true, "fromXml", "", "", "ReturnValue", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap.dataset", "EDD", true, "fromXml", "", "", "ReturnValue", "sql-injection", "manual"]
      - ["gov.noaa.pfel.erddap.dataset", "EDD", true, "fromXml", "", "", "ReturnValue", "command-injection", "manual"]
      
      - ["gov.noaa.pfel.erddap", "LoadDatasets", false, "parseUsingSimpleXmlReader", "", "", "Argument[0]", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "LoadDatasets", false, "parseUsingSimpleXmlReader", "", "", "Argument[0]", "sql-injection", "manual"]

      # ========================================================================
      # 2. MODERN INITIALIZATION PATHWAY (Concrete Handlers Only)
      # ========================================================================
      - ["gov.noaa.pfel.erddap", "DatasetHandler", true, "characters", "", "", "Argument[0]", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "DatasetHandler", true, "characters", "", "", "Argument[0]", "sql-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "DatasetHandler", true, "startElement", "", "", "Argument[3]", "path-injection", "manual"]
      
      - ["gov.noaa.pfel.erddap", "TopLevelHandler", true, "characters", "", "", "Argument[0]", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "TopLevelHandler", true, "characters", "", "", "Argument[0]", "sql-injection", "manual"]

      # ========================================================================
      # 3. EDCONFIG PATHWAY (Trusted Configuration Container)
      # ========================================================================
      # Leaving the method name blank ("") acts as a wildcard. CodeQL will 
      # automatically consider any data returning from ANY getter or method 
      # inside EDConfig as entirely safe and untainted.
      - ["gov.noaa.pfel.erddap.util", "EDConfig", false, "", "", "", "ReturnValue", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDConfig", false, "", "", "", "ReturnValue", "sql-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDConfig", false, "", "", "", "ReturnValue", "command-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDConfig", false, "", "", "", "ReturnValue", "request-ssrf", "manual"]

      # ========================================================================
      # 4. EDSTATIC HOST/URL VALIDATION PATHWAY (Sanitizing Barrier Models)
      # ========================================================================
      # We define multiple potential kind names (xss, xss-html, html-injection, cross-site-scripting, reflected-xss)
      # to ensure that CodeQL correctly maps the custom sanitization barriers for the XSS taint-tracking query.
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "cleanUrlChars", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "cleanUrlChars", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "cleanUrlChars", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "cleanUrlChars", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "cleanUrlChars", "", "", "ReturnValue", "reflected-xss", "manual"]

      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "normalizeAndValidateHost", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "normalizeAndValidateHost", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "normalizeAndValidateHost", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "normalizeAndValidateHost", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "normalizeAndValidateHost", "", "", "ReturnValue", "reflected-xss", "manual"]

      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getHostAndPathFromRequest", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getHostAndPathFromRequest", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getHostAndPathFromRequest", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getHostAndPathFromRequest", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getHostAndPathFromRequest", "", "", "ReturnValue", "reflected-xss", "manual"]

      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "baseUrl", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "baseUrl", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "baseUrl", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "baseUrl", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "baseUrl", "", "", "ReturnValue", "reflected-xss", "manual"]

      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getErddapUrlPrefix", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getErddapUrlPrefix", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getErddapUrlPrefix", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getErddapUrlPrefix", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "getErddapUrlPrefix", "", "", "ReturnValue", "reflected-xss", "manual"]

      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapUrl", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapUrl", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapUrl", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapUrl", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapUrl", "", "", "ReturnValue", "reflected-xss", "manual"]

      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapHttpsUrl", "", "", "ReturnValue", "xss", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapHttpsUrl", "", "", "ReturnValue", "xss-html", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapHttpsUrl", "", "", "ReturnValue", "html-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapHttpsUrl", "", "", "ReturnValue", "cross-site-scripting", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "erddapHttpsUrl", "", "", "ReturnValue", "reflected-xss", "manual"]
