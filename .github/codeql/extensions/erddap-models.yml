extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: barrierModel
    data:
      # ========================================================================
      # 1. LEGACY PATHWAY (SimpleXmlReader & EDD Factory)
      # ========================================================================
      - ["gov.noaa.pfel.erddap.dataset", "EDD", true, "fromXml", "", "", "ReturnValue", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap.dataset", "EDD", true, "fromXml", "", "", "ReturnValue", "sql-injection", "manual"]
      - ["gov.noaa.pfel.erddap.dataset", "EDD", true, "fromXml", "", "", "ReturnValue", "command-injection", "manual"]
      
      - ["gov.noaa.pfel.erddap", "LoadDatasets", false, "parseUsingSimpleXmlReader", "", "", "Argument[0]", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "LoadDatasets", false, "parseUsingSimpleXmlReader", "", "", "Argument[0]", "sql-injection", "manual"]

      # ========================================================================
      # 2. MODERN PATHWAY (Global SAX Interface Interceptor)
      # ========================================================================
      - ["org.xml.sax", "ContentHandler", true, "characters", "", "", "Argument[0]", "path-injection", "manual"]
      - ["org.xml.sax", "ContentHandler", true, "characters", "", "", "Argument[0]", "sql-injection", "manual"]
      - ["org.xml.sax", "ContentHandler", true, "characters", "", "", "Argument[0]", "command-injection", "manual"]
      
      - ["org.xml.sax", "ContentHandler", true, "startElement", "", "", "Argument[3]", "path-injection", "manual"]
      - ["org.xml.sax", "ContentHandler", true, "startElement", "", "", "Argument[3]", "sql-injection", "manual"]
      - ["org.xml.sax", "ContentHandler", true, "startElement", "", "", "Argument[3]", "command-injection", "manual"]

      # ========================================================================
      # 3. ERDDAP SPECIFIC SAX HANDLERS (Defensive Fallback)
      # ========================================================================
      - ["gov.noaa.pfel.erddap", "DatasetHandler", true, "", "", "", "Argument[0]", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "DatasetHandler", true, "", "", "", "Argument[0]", "sql-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "TopLevelHandler", true, "", "", "", "Argument[0]", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap", "TopLevelHandler", true, "", "", "", "Argument[0]", "sql-injection", "manual"]

      # ========================================================================
      # 4. SETUP.XML PATHWAY (EDStatic Global Trust - for setup.xml)
      # ========================================================================
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "", "", "", "ReturnValue", "path-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "", "", "", "ReturnValue", "sql-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "", "", "", "ReturnValue", "command-injection", "manual"]
      - ["gov.noaa.pfel.erddap.util", "EDStatic", false, "", "", "", "ReturnValue", "request-ssrf", "manual"]
